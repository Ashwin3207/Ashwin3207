  <path d="M0 220C250 184 370 256 610 220C820 188 1000 204 1200 174" stroke="#63E6FF" stroke-opacity="0.2"/>

  <g opacity="0.8" stroke="url(#edge)" stroke-width="2">
    <path d="M780 86L958 126L958 278L780 238Z"/>
    <path d="M780 86L858 52L1036 92L958 126Z"/>
