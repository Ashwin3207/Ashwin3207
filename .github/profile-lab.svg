      <stop offset="0.52" stop-color="#10172A"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="edge" x1="720" y1="70" x2="1010" y2="290" gradientUnits="userSpaceOnUse">
