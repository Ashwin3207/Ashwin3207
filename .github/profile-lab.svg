  </g>

  <g fill="#63E6FF" filter="url(#glow)">
    <circle cx="858" cy="52" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="958" cy="126" r="4"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
